[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "white_noise_experimentation"
version = "0.1.0"
description = "Research project for noise-modulated STDP in spiking neural networks for BCI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Elena", email = "elenagallegomauleon@github.com"}
]
license = {text = "MIT"}

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=1.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "mne>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
white_noise_experimentation = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
