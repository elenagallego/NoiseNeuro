# Subtle drift configuration.
#
# Uses realistic BCI session drift instead of the strong synthetic drift.
# Controlled by drift_strength (0.1 = mild, realistic).

include: base.yaml

data:
  drift_mode: "subtle"
  drift_strength: 0.15

model:
  type: "ann_autoencoder"
  n_channels: 22
  window_size: 256
  latent_dim: 64
  hidden_dims: [128, 64]

noise:
  enabled: false
  sigma: 0.0
